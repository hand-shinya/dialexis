# ---------------------------------------------------------------------------
# 閉じていない穴（2026-10-09 の敵対的検証が実証したもののうち、まだ塞げていない分）
#
#   U1 行の削除は、git に追跡された file の差分としては残るが、
#      過去版が HEAD に無い初回 commit では比較できない。
#      対策: schema 2 の試験は `git show HEAD:<台帳>` と id 集合を比べる。
#      HEAD に台帳が無い間（この commit まで）は比較できないので、そこは未強制である。
#   U2 observation の実測は自動収集されていない。期日に人か AI が測る。
#      測った値を observed に書くことは強制できるが、値が正しいことは強制できない（公理7）。
#   U3 「機構」の定義そのものは機械に無い。関門を1本増やしただけで試験fileを作らなければ、
#      expected_tests は動かず、台帳も動かない。
#      なお試験file自身の削除は、2026-10-09 に verify.sh の step 0
#      （tools/check_register_files.py）へ出して塞いだ。pytest の中に置くと、
#      検査する試験fileを消したときに検査もろとも消える。
#   U4 期日の到来は deploy のときにしか見えない。期日より前に知らせる経路は無い。
#   U5 /api/combine と /api/gravity が返す basis・context_match は、画面のどこにも
#      出ていない（app.js に1箇所も無いことを grep で確認）。kind は canvas の点の
#      色を決めるだけで、凡例も無い。利用者に届いているのは note の文だけである。
#      「basis を付けた」は API の契約についてのみ成立する（公理3）。
#   U6 無鉄砲 の「無」は否定辞ではないが、_SEMANTIC_PREFIXES が接頭辞として扱うため
#      applies_to_term=True になる。これは注記の作りではなく分割表の側の限界である。
#   U7 tests/e2e/*.e2e.js は expected_tests の対象外である。e2e を消しても
#      台帳は動かない（tests/test_*.py だけを数えている）。
#   U8 自由text層は「押したときだけ」外へ出るが、押したかどうかは client の申告である
#      （`web` flag）。origin と同じ型の限界で、発信者の判定機構は無い。
#      保証できるのは「既定では外へ出ない」ことと「投げた文字列を残す」ことだけである。
#   U9 外へ送るのは語だけで文の全体は送らないが、語は文から機械的に取ったものなので、
#      利用者が書いた固有の言い方がそのまま語として出ることはありうる。
#      送る前に語を画面で確かめる経路は、まだ無い。
