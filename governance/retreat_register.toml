# 撤退台帳 — M0 §7.1 を外部機構にするための足場（2026-10-09・schema 2）
#
# 名乗り（公理3）:
#   これは「M0 §7.1 を外部強制にしたもの」ではない。**外部強制にするための足場**である。
#   2026-10-09 の敵対的検証で、初版（schema 1）は次のどれでも通ることが実証された。
#     ・全欄を無意味な文字列で埋める（`retreat = "この機構は削除しない"` が通った）
#     ・期日を 2099-01-01 に延ばす
#     ・期日超過の項を、codeを残したまま台帳から1行消す
#     ・項を [[correction]] に札替えして期日の要求を外す
#     ・`tests/test_retreat_register.py` そのものを消す（静かに全部通った）
#   schema 2 はこのうち実装できる分を閉じた。閉じていない分は末尾の「閉じていない穴」に書く。
#
# なぜ在るか:
#   M0 §7.1 は、機構・gate・定期実行を足す提案に 期日／観測点／期日に効果が無ければ削除する
#   の三つを要求する。2026-07-11〜08-07 に撤退はゼロで、job 28→48・資産 62→103・
#   gate 約4→14 と増えた。Dialexis でも 2026-10-08 に関門12本と道具1本が増え、
#   どれにも期日が無かった。仕様書 §12.12 はそれを欠陥として記述したが、
#   記述は実行ではない（M0 C3）。公理6 により、強制は AI の外部に置く。
#
# 書き方:
#   [[mechanism]] 継続して注意・保守・実行の費用が掛かるもの。期日が必須。
#   [[correction]] 偽の表示や誤った宣言を直したもの。費用が増えないので期日は不要。
#                  ただし守る試験（tests/test_*.py で、実際に試験関数を持つもの）が必須。
#   expected_tests  tests/ に在るべき試験fileの全集合。disk と一致しなければ落ちる。
#                  試験fileを消して黙らせる経路と、台帳に書かずに機構を足す経路を同時に塞ぐ。
#
# 期日が来たら、どちらかしかない:
#   status = "retired"   その機構を消し、retired_at を書く（行は残す。消さない）
#   status = "continued" observed に実測値、evidence にその出所、verdict に根拠、
#                        verdict_date に日付を書く。1語では通らない。
#   「観察を継続する」「保留」「とりあえず置く」は、どちらでもない。

schema_version = 2
updated = "2026-10-09"
# 期日の判定に使う時刻帯を固定する。date.today() は機械のTZを見るので、
# 同じ commit が UTC の機械では1日ゆるくなる（2026-10-09 に実証した）。
timezone = "Asia/Tokyo"
# 期日は追加日から何日先までを許すか。上限が無いと 2099 と書いて永久に逃げられる。
max_horizon_days = 90

