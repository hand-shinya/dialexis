#       初版ではそれが静かに通った（315 passed・rc=0）。
#   (2) 機構を足して台帳に書かない経路は、初版では完全に無強制だった。
#       新しい関門はほぼ必ず新しい試験fileを伴うので、この集合との不一致で検出する。
